[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadism"
version = "2.0.0"
description = "Ultra-high-performance async UserBot library for the Shad messenger web protocol"
readme = "README.md"
authors = [
    { name = "AmirAli khosravinejad", email = "khosravinejad.amirali@gmail.com" },
]
maintainers = [
    { name = "AmirAli khosravinejad", email = "khosravinejad.amirali@gmail.com" },
]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
keywords = ["shad", "messenger", "userbot", "async", "asyncio", "chat", "bot"]
dependencies = [
    "httpx>=0.27.0",
    "h2>=4.0.0",
    "cryptography>=42.0.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://amirali-khosravinejad.github.io/shadism/"
Documentation = "https://amirali-khosravinejad.github.io/shadism/"
"Bale Channel" = "https://ble.ir/join/8jXbafMPwL"
Repository = "https://github.com/AmirAli-khosravinejad/shadism"
Issues = "https://github.com/AmirAli-khosravinejad/shadism/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadism*"]

[tool.setuptools.package-data]
shadism = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC"]
ignore = ["ANN101", "ANN102"]
